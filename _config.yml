# Telar - Digital Storytelling Framework
# https://github.com/UCSB-AMPLab/telar

# Site Settings
title: Big Basin Redwoods State Park Digital History
description: "In May 1900, the Sempervirens Club of California launched the year-long campaign to preserve among the last old growth coastal redwoods in the Santa Cruz Mountains. In spring of 1902, California Redwood Park (later renamed Big Basin Redwoods State Park) officially opened to the public, becoming California's oldest state park. It was locals, primarily, that championed the movement to preserve Big Basin. Local writers, newspaper editors, school teachers, artists, photographers, clergymen, university professors, and even lumbermen rallied behind the shared mission to 'Save the Redwoods.' This Sempervirens Club digital history aims to illustrate how a group of concerned citizens, none of which were elites by any measure, founded California's oldest state park on democratic values and a shared belief in nature recreation for all, not just the wealthy elite."
baseurl: "/bigbasinhistory"
url: "https://sevallos.github.io"
author: "Gabriel Sevallos"
email: ""
telar_theme: "austin" # Options: paisajes, neogranadina, santa-barbara, austin, or custom
logo: "" # Path to logo image (optional, max 80px tall, 200-300px wide recommended)
telar_language: "en" # Options: "en" (English), "es" (Español)

# Story Interface Settings
story_interface:
  show_story_steps: true # Set to false to hide "Step X" overlay in stories
  show_object_credits: true # Set to true to display object credits badge (bottom-left corner, dismissable)
  include_demo_content: false # Fetch demo stories from content.telar.org. Switch this off to hide demo stories and their content.

# Google Sheets Integration (optional)
# Manage content via Google Sheets instead of editing CSV files directly.
# See https://telar.org/docs/workflows/google-sheets/ for detailed setup instructions.
#
# Setup:
# 1. Get the template: Duplicate our template at https://bit.ly/telar-template
# 2. Share your sheet: Anyone with the link (Viewer access)
# 3. Publish your sheet: File > Share > Publish to web
# 4. Paste both URLs below
# 5. Set enabled: true
# 6. Commit changes
#    - If using GitHub Pages: GitHub Actions will automatically discover tab GIDs and fetch CSVs
#    - If running locally: Run `python3 scripts/fetch_google_sheets.py` before building
google_sheets:
  enabled: true
  shared_url: "https://docs.google.com/spreadsheets/d/11Q7gQ9GfkdHKzmhAFMzAzAWxPRA_AYyfvjIE9DruqOw/edit?usp=sharing"
  published_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxVz8RJo20h_f1jqwqF2yP_Sf6GKTBVpfSlsJQcec9UAMuyupRskuj-0rERf0huZquAKP53QUsn2J1/pubhtml"


#
#
#
# PLEASE DO NOT EDIT BELOW THIS LINE UNLESS YOU KNOW WHAT YOU ARE DOING
#
#
#

# Collections
collections:
  stories:
    output: true
    permalink: /stories/:name/
  objects:
    output: true
    permalink: /objects/:name/
  glossary:
    output: true
    permalink: /glossary/:name/

# Collections Directory (a folder where Jekyll and the Telar scripts will put all auto-generated object and story working files)
collections_dir: _jekyll-files

# Build Settings
markdown: kramdown
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .github
  - README.md
  - docs/
  - scripts/

# Defaults
defaults:
  - scope:
      path: ""
      type: "stories"
    values:
      layout: "story"
  - scope:
      path: ""
      type: "objects"
    values:
      layout: "object"
  - scope:
      path: ""
      type: "glossary"
    values:
      layout: "glossary"

# Tell Jekyll not to expect dates for these collections
future: true
show_drafts: false

# Telar Settings (version information)
telar:
  version: "0.6.2-beta"
  release_date: "2025-12-04"

# Plugins
plugins:
  - jekyll-seo-tag

# WEBrick server configuration for development (enables CORS for IIIF)
webrick:
  headers:
    Access-Control-Allow-Origin: "*"
    Access-Control-Allow-Methods: "GET, POST, OPTIONS"
    Access-Control-Allow-Headers: "Content-Type"

# Development & Testing
# Set to false or remove for production use
development-features:
  # Christmas Tree Mode - Displays all warning messages for testing multilingual support
  # Set to true to light up the site with test warnings (test objects, fake errors, etc.)
  christmas_tree_mode: false
